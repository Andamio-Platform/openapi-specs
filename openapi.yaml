openapi: 3.0.0
info:
  description: This is the central API Gateway for the Andamio platform, providing
    a unified interface for various services including Atlas TX Builder and Node
    Backend API. It handles authentication, authorization, rate limiting, and
    routes requests to the appropriate backend services.
  title: Andamio API Gateway
  termsOfService: https://andamio.io/terms
  contact:
    name: Andamio API Support
    url: https://andamio.io/support
    email: support@andamio.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v1.0.0
paths:
  /admin/set-user-role:
    post:
      security:
        - BearerAuth: []
      description: This endpoint allows an administrator to set a user's subscription tier.
      tags:
        - Admin
        - Setting
      summary: Set User Role
      operationId: set-user-role
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin_viewmodels.SetUserRoleRequest"
        description: Set User Role Request Body - Contains the user ID and either the
          new tier ID or tier name (at least one must be provided).
        required: true
      responses:
        "200":
          description: Successfully updated the user's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin_viewmodels.SetUserRoleResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or the provided tier ID/name is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication failed or user is not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - The user IP is blacklisted or user does not have admin
            privileges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "404":
          description: Not Found - The specified user was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: setUserRoleV1
      x-rate-limit-tier: admin
  /admin/usage/any-user-daily-api-usage:
    post:
      security:
        - BearerAuth: []
      description: This endpoint retrieves aggregated daily API usage data for
        administrators, allowing filtering by date range and a list of user
        information (alias and optional API key names).
      tags:
        - Admin
        - API Usage
      summary: Get Any User Daily API Usage
      operationId: any-user-daily-api-usage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_usage_viewmodels.AnyUserDailyApiUsageRequest"
        description: Any User Daily Usage Request Body - Contains filters for date range
          and user information.
        required: true
      responses:
        "200":
          description: Successfully retrieved daily API usage summaries. The response
            contains a list of daily summaries aggregated by user, and then by
            API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_usage_viewmodels.AnyUserDailyApiUsageResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or contains invalid date formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. Admin privileges needed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions or tier access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: admin
      x-metadata-status: alpha
      x-operation-id: anyUserDailyUsageHandlerV1
      x-rate-limit-tier: none
  /admin/usage/user-api-usage:
    post:
      security:
        - BearerAuth: []
      description: This endpoint retrieves API usage metrics for a specified user,
        allowing filtering by date range and an optional list of API key names.
        This endpoint is only accessible to administrators.
      tags:
        - Admin
        - API Usage
      summary: Get User API Usage Metrics (Admin)
      operationId: user-api-usage-metrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_usage_viewmodels.UserAPIUsageRequest"
        description: API Usage Metric Request Body - Contains user alias, filters for
          date range, and optional list of API key names.
        required: true
      responses:
        "200":
          description: Successfully retrieved raw API usage metrics. The response contains
            a list of raw metrics grouped by API key for the specified user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_usage_viewmodels.UserAPIUsageResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or contains invalid date formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. Admin user ID not found in
            authentication context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions. Only administrators can
            access this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The administrator has exceeded the rate limit
            for this endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: admin
      x-metadata-status: alpha
      x-operation-id: userAPIUsageMetricHandlerV1
      x-rate-limit-tier: none
  /api/v2/admin/tx/stats:
    get:
      security:
        - ApiKeyAuth: []
      description: Returns statistics about the TX state machine (admin only).
      tags:
        - TX State Machine
        - Admin
      summary: Get TX State Machine Stats
      operationId: v2-admin-tx-stats
      responses:
        "200":
          description: TX state machine statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tx_state_handlers.TxStatsResponse"
        "500":
          description: Failed to get stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/account/delete:
    post:
      security:
        - ApiKeyAuth: []
      description: Permanently deletes the authenticated developer's account and all
        associated data.
      tags:
        - APIKey
        - Developer
      summary: Delete Developer Account
      operationId: v2-apikey-developer-account-delete
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/key/delete:
    post:
      security:
        - ApiKeyAuth: []
      description: Deletes the specified API key belonging to the authenticated developer.
      tags:
        - APIKey
        - Developer
      summary: Delete API Key
      operationId: v2-apikey-developer-key-delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.DeleteAPIKeyRequest"
        description: Delete key request
        required: true
      responses:
        "200":
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.DeleteAPIKeyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/key/request:
    post:
      security:
        - ApiKeyAuth: []
      description: Generates and returns a new API key for the authenticated developer.
      tags:
        - APIKey
        - Developer
      summary: Request New API Key
      operationId: v2-apikey-developer-key-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.APIKeyRequest"
        description: API key request
        required: true
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.APIKeyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: API key limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/key/rotate:
    post:
      security:
        - ApiKeyAuth: []
      description: Rotates the specified API key, generating a new key while
        invalidating the old one.
      tags:
        - APIKey
        - Developer
      summary: Rotate API Key
      operationId: v2-apikey-developer-key-rotate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.RotateAPIKeyRequest"
        description: Rotate key request
        required: true
      responses:
        "200":
          description: API key rotation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.RotateAPIKeyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/profile/get:
    get:
      security:
        - ApiKeyAuth: []
      description: Returns the authenticated developer's profile information.
      tags:
        - APIKey
        - Developer
      summary: Get Developer Profile
      operationId: v2-apikey-developer-profile-get
      responses:
        "200":
          description: Developer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user_viewmodels.MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/apikey/developer/usage/get:
    get:
      security:
        - ApiKeyAuth: []
      description: Returns the authenticated developer's API usage statistics.
      tags:
        - APIKey
        - Developer
      summary: Get Developer Usage
      operationId: v2-apikey-developer-usage-get
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user_viewmodels.UsageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/auth/developer/account/login:
    post:
      description: Authenticates a developer and returns a JWT token for API access.
      tags:
        - Auth
        - Developer
      summary: Developer Login
      operationId: v2-auth-developer-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_viewmodels.LoginRequest"
        description: Developer login request
        required: true
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth_viewmodels.LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/auth/developer/account/register:
    post:
      description: Registers a new developer account for API access. Creates account
        with default free tier.
      tags:
        - Auth
        - Developer
      summary: Register Developer Account
      operationId: v2-auth-developer-register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_viewmodels.RegisterRequest"
        description: Developer registration request
        required: true
      responses:
        "200":
          description: Successfully registered developer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth_viewmodels.RegisterResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "409":
          description: Alias already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ConflictErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
  /api/v2/auth/user/login/challenge:
    post:
      description: Initiates wallet-based authentication by generating a nonce for
        CIP-30 signing.
      tags:
        - DB API
        - Auth
      summary: Initiate Wallet Login Session
      operationId: v2-db-auth-login-session
      responses:
        "200":
          description: Login session with nonce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                  .LoginSessionResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/auth/user/login/verify:
    post:
      description: Validates CIP-30 wallet signature and returns JWT token for
        authenticated sessions.
      tags:
        - DB API
        - Auth
      summary: Validate Wallet Signature
      operationId: v2-db-auth-login-validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                .ValidateSignatureRequest"
        description: Signature validation request
        required: true
      responses:
        "200":
          description: JWT token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                  .ValidateSignatureResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/owner/course/create:
    post:
      security:
        - ApiKeyAuth: []
      description: Creates a new course in DRAFT status.
      tags:
        - DB API
        - Course Owner
      summary: Create Course Draft
      operationId: v2-db-owner-create-course
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                .CreateCourseRequest"
        description: Course creation request
        required: true
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio_db_client.CourseResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/owner/course/delete:
    post:
      security:
        - ApiKeyAuth: []
      description: Deletes a course (owner only).
      tags:
        - DB API
        - Course Owner
      summary: Delete Course
      operationId: v2-db-owner-delete-course
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                .CourseOwnerCourseDeletePostRequest"
        description: Delete request
        required: true
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/owner/course/register:
    post:
      security:
        - ApiKeyAuth: []
      description: Creates a course when a minting transaction is submitted.
      tags:
        - DB API
        - Course Owner
      summary: Mint Course
      operationId: v2-db-owner-mint-course
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/andamio_db_client.CourseOwnerCourseMintPostRequest"
        description: Mint request
        required: true
      responses:
        "200":
          description: Minted course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio_db_client.CourseResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/owner/course/update:
    post:
      security:
        - ApiKeyAuth: []
      description: Updates an existing course.
      tags:
        - DB API
        - Course Owner
      summary: Update Course
      operationId: v2-db-owner-update-course
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/andamio-api_internal_internal_api_andamio_db_client\
                .UpdateCourseRequest"
        description: Course update request
        required: true
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio_db_client.CourseResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/owner/courses/list:
    post:
      description: Returns courses owned by or contributed to by the authenticated
        user (DB only, Andamioscan enrichment pending)
      tags:
        - Courses (Merged)
      summary: List owner courses
      operationId: v2-merged-course-owner-list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCoursesResponse"
        "502":
          description: DB API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  /api/v2/course/shared/assignment-commitment/get:
    post:
      security:
        - ApiKeyAuth: []
      description: Returns a single commitment by course, module, and learner alias.
      tags:
        - DB API
        - Course Shared
      summary: Get Commitment
      operationId: v2-db-shared-get-commitment
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: Get request
        required: true
      responses:
        "200":
          description: Commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/andamio_db_client.AssignmentCommitmentResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestResponse"
        "404":
          description: Commitment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "502":
          description: DB API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadGatewayErrorResponse"
  /api/v2/course/shared/assignment-commitment/update-status:
    post:
      security:
        - ApiKeyAuth: []
      description: Updates the network status for an assignment commitment.
      tags:
        - DB API
        - Course Shared
      summary: Update Commitment Status
      operationId: v2-db-shared-update-commitment-status
      requestBody:
        content:
          application/json:
            schema:
              type: object
