openapi: 3.0.0
info:
  description: This is the central API Gateway for the Andamio platform, providing
    a unified interface for various services including Atlas TX Builder and Node
    Backend API. It handles authentication, authorization, rate limiting, and
    routes requests to the appropriate backend services.
  title: Andamio API Gateway
  termsOfService: https://andamio.io/terms
  contact:
    name: Andamio API Support
    url: https://andamio.io/support
    email: support@andamio.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v1.0.0
paths:
  /admin/set-user-role:
    post:
      security:
        - BearerAuth: []
      description: This endpoint allows an administrator to set a user's subscription tier.
      tags:
        - Admin
        - Setting
      summary: Set User Role
      operationId: set-user-role
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin_viewmodels.SetUserRoleRequest"
        description: Set User Role Request Body - Contains the user ID and either the
          new tier ID or tier name (at least one must be provided).
        required: true
      responses:
        "200":
          description: Successfully updated the user's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin_viewmodels.SetUserRoleResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or the provided tier ID/name is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication failed or user is not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - The user IP is blacklisted or user does not have admin
            privileges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "404":
          description: Not Found - The specified user was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: setUserRoleV1
      x-rate-limit-tier: admin
  /admin/usage/any-user-daily-api-usage:
    post:
      security:
        - BearerAuth: []
      description: This endpoint retrieves aggregated daily API usage data for
        administrators, allowing filtering by date range and a list of user
        information (alias and optional API key names).
      tags:
        - Admin
        - API Usage
      summary: Get Any User Daily API Usage
      operationId: any-user-daily-api-usage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_usage_viewmodels.AnyUserDailyApiUsageRequest"
        description: Any User Daily Usage Request Body - Contains filters for date range
          and user information.
        required: true
      responses:
        "200":
          description: Successfully retrieved daily API usage summaries. The response
            contains a list of daily summaries aggregated by user, and then by
            API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_usage_viewmodels.AnyUserDailyApiUsageResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or contains invalid date formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. Admin privileges needed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions or tier access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: admin
      x-metadata-status: alpha
      x-operation-id: anyUserDailyUsageHandlerV1
      x-rate-limit-tier: none
  /admin/usage/user-api-usage:
    post:
      security:
        - BearerAuth: []
      description: This endpoint retrieves API usage metrics for a specified user,
        allowing filtering by date range and an optional list of API key names.
        This endpoint is only accessible to administrators.
      tags:
        - Admin
        - API Usage
      summary: Get User API Usage Metrics (Admin)
      operationId: user-api-usage-metrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_usage_viewmodels.UserAPIUsageRequest"
        description: API Usage Metric Request Body - Contains user alias, filters for
          date range, and optional list of API key names.
        required: true
      responses:
        "200":
          description: Successfully retrieved raw API usage metrics. The response contains
            a list of raw metrics grouped by API key for the specified user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_usage_viewmodels.UserAPIUsageResponse"
        "400":
          description: Bad Request - The request body is malformed, missing required
            fields, or contains invalid date formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. Admin user ID not found in
            authentication context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions. Only administrators can
            access this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The administrator has exceeded the rate limit
            for this endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: admin
      x-metadata-status: alpha
      x-operation-id: userAPIUsageMetricHandlerV1
      x-rate-limit-tier: none
  /api/v2/course/student/course-status:
    post:
      description: Returns student's course progress with both off-chain and on-chain
        progress data
      tags:
        - Courses (Merged)
      summary: Get student course status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/merged_handlers.StudentCourseStatusRequest"
        description: Student course status request
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCourseStatusResponse"
        "206":
          description: Partial content (one backend unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCourseStatusResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
        "502":
          description: Both backends unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  "/api/v2/course/user/course/get/{policy_id}":
    get:
      description: Returns detailed course info with both off-chain (DB) and on-chain
        (Andamioscan) data
      tags:
        - Courses (Merged)
      summary: Get course detail with on-chain state
      parameters:
        - description: Course Policy ID
          name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCourseDetailResponse"
        "206":
          description: Partial content (one backend unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCourseDetailResponse"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
        "502":
          description: Both backends unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  /api/v2/course/user/courses/list:
    get:
      description: Returns all published courses with both off-chain (DB) and on-chain
        (Andamioscan) data
      tags:
        - Courses (Merged)
      summary: List courses with on-chain state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCoursesResponse"
        "206":
          description: Partial content (one backend unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedCoursesResponse"
        "502":
          description: Both backends unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  "/api/v2/project/contributor/status/{project_id}/{alias}":
    get:
      description: Returns the contributor's status and progress in a specific project
      tags:
        - Projects (Merged)
      summary: Get contributor status in project
      parameters:
        - description: Project ID
          name: project_id
          in: path
          required: true
          schema:
            type: string
        - description: Contributor Alias
          name: alias
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ContributorStatusResponse"
        "404":
          description: Contributor or project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
        "502":
          description: Backend unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  "/api/v2/project/user/project/{project_id}":
    get:
      description: Returns detailed project info with both off-chain (DB) and on-chain
        (Andamioscan) data
      tags:
        - Projects (Merged)
      summary: Get project detail with on-chain state
      parameters:
        - description: Project ID
          name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedProjectDetailResponse"
        "206":
          description: Partial content (one backend unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedProjectDetailResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
        "502":
          description: Both backends unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  /api/v2/project/user/projects/list:
    get:
      description: Returns all published projects with both off-chain (DB) and
        on-chain (Andamioscan) data
      tags:
        - Projects (Merged)
      summary: List projects with on-chain state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedProjectsResponse"
        "206":
          description: Partial content (one backend unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.MergedProjectsResponse"
        "502":
          description: Both backends unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merged_handlers.ErrorResponse"
  /apikey/delete:
    post:
      security:
        - BearerAuth: []
      description: This endpoint allows an authenticated user to revoke or delete a
        specific API key associated with their account. This action is
        irreversible and enhances security by invalidating compromised keys.
      tags:
        - API Key
      summary: Revoke/Delete an API Key
      operationId: delete-api-key-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.DeleteAPIKeyRequest"
        description: Delete API Key Request Body - Contains the name of the API key to
          be deleted.
        required: true
      responses:
        "200":
          description: Successfully deleted the API key. The response confirms the deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.DeleteAPIKeyResponse"
        "400":
          description: Bad Request - The request body is malformed or missing required
            fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. User ID not found in
            authentication context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions or tier access. The API key
            does not belong to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: deleteApiKeyV1
      x-rate-limit-tier: none
  /apikey/request:
    post:
      security:
        - BearerAuth: []
      description: This endpoint generates and returns a new API key for the
        authenticated user. The new key can be used for subsequent API requests.
      tags:
        - API Key
      summary: Request a New API Key
      operationId: request-api-key-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.APIKeyRequest"
        description: API Key Request Body - Contains details for the new API key, such
          as its name and expiration duration.
        required: true
      responses:
        "200":
          description: Successfully generated a new API key. The response contains the new
            API key, its creation and expiration timestamps, and its active
            status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.APIKeyResponse"
        "400":
          description: Bad Request - The request body is malformed or missing required
            fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. User ID not found in
            authentication context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions or tier access. User does not
            have required role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint or reached the maximum API key limit. Please wait and try
            again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: requestApiKeyV1
      x-rate-limit-tier: none
  /apikey/rotate:
    post:
      security:
        - BearerAuth: []
      description: This endpoint validates the existence of the provided API key name.
        If the key name exists and belongs to the authenticated user, it checks
        its expiration status. If the API key is found to be expired or within 1
        day of expiration, its validity is extended by the specified duration.
      tags:
        - API Key
      summary: Rotate API Key
      operationId: rotate-api-key-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key_viewmodels.RotateAPIKeyRequest"
        description: API Key Rotation Request (using API key name and optional
          expiration in days)
        required: true
      responses:
        "200":
          description: Successfully extended the API key's expiration. The response
            contains a confirmation message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_key_viewmodels.RotateAPIKeyResponse"
        "400":
          description: Bad Request - The request body is malformed or missing required
            fields or 'expires_in_days' is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication required. User ID not found in
            authentication context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions or tier access. The API key
            name does not belong to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "404":
          description: Not Found - The provided API key name does not exist or does not
            belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.NotFoundErrorResponse"
        "409":
          description: Conflict - The API key is not yet eligible for rotation or does not
            have an expiration date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ConflictErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: rotateApiKeyV1
      x-rate-limit-tier: none
  /auth/login:
    post:
      description: This endpoint authenticates a user using their alias and wallet
        address. Upon successful authentication, a new JWT (JSON Web Token) is
        returned for subsequent API requests.
      tags:
        - Authentication
      summary: User Login
      operationId: user-login-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_viewmodels.LoginRequest"
        description: Login Request Body - Contains the user's alias and wallet address
          for authentication.
        required: true
      responses:
        "200":
          description: Successfully authenticated and generated a JWT. The response
            contains the JWT and user ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth_viewmodels.LoginResponse"
        "400":
          description: Bad Request - The request body is malformed or missing required
            fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "401":
          description: Unauthorized - Authentication failed due to incorrect alias or
            wallet address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnauthorizedErrorResponse"
        "403":
          description: Forbidden - The user IP is blacklisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
      x-access-level: internal
      x-metadata-status: alpha
      x-operation-id: loginV1
      x-rate-limit-tier: none
  /auth/register:
    post:
      description: This endpoint registers a new user with a unique alias and optional
        email and wallet address. A default free tier subscription is
        automatically assigned upon successful registration.
      tags:
        - Authentication
      summary: Register New User
      operationId: user-register-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_viewmodels.RegisterRequest"
        description: Registration Request Body - Contains the user's desired alias,
          optional email, and wallet address for registration.
        required: true
      responses:
        "200":
          description: Successfully registered the user. The response includes the user's
            ID, alias, tier, and subscription expiration details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth_viewmodels.RegisterResponse"
        "400":
          description: Bad Request - The request body is malformed or missing required
            fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.BadRequestErrorResponse"
        "403":
          description: Forbidden - The user IP is blacklisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ForbiddenErrorResponse"
        "409":
          description: Conflict - The provided alias is already taken by another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.ConflictErrorResponse"
        "422":
          description: Unprocessable Entity - Validation failed. The request data is
            syntactically correct but semantically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.UnprocessableEntityErrorResponse"
        "429":
          description: Too Many Requests - The user has exceeded the rate limit for this
            endpoint. Please wait and try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.TooManyRequestsErrorResponse"
        "500":
          description: Internal Server Error - An unexpected error occurred on the server.
            This could be due to issues with the backend services or database.
            Please try again later or contact support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errors.InternalServerErrorResponse"
